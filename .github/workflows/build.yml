name: Build APKs

# Builds both debug APKs on GitHub's servers (which have the Android SDK and
# full network access) and publishes them to the "latest" release so they can
# be downloaded straight to a phone — no Android Studio needed.

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to create/update the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu-latest runner ships with the Android SDK (platform 34 and
      # build-tools) preinstalled, so no separate SDK setup step is needed.

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Regenerate a pristine Gradle wrapper on the runner (network is
      # available here) so the build never depends on the committed jar.
      - name: Ensure a valid Gradle wrapper
        run: |
          tmp="$(mktemp -d)"
          ( cd "$tmp" && echo 'rootProject.name = "w"' > settings.gradle \
            && gradle wrapper --gradle-version 8.9 --distribution-type bin )
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          echo "Wrapper jar refreshed: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Build debug APKs
        run: |
          set +e
          ./gradlew :tablet:assembleDebug :phone:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Surface the real Kotlin/AAPT errors as annotations, since CI log
            # files are not reachable from the authoring environment.
            grep -nE "^e: |^w: |error:|Unresolved|Too many|overrides nothing|Type mismatch|None of the following|cannot|AAPT" build.log \
              | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            echo "---- tail ----"
            tail -n 20 build.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::TAIL $line"
            done
          fi
          exit "$code"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp tablet/build/outputs/apk/debug/tablet-debug.apk dist/dad-tablet.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk  dist/dad-phone.apk
          ls -la dist

      # Downloadable from the Actions run page as well
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dad-apks
          path: dist/*.apk

      # Publishes/updates a "latest" release so Releases is never empty
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            أحدث نسخة مبنية تلقائياً من آخر تحديث على main.
            - **dad-tablet.apk** — يُركّب على التابلت.
            - **dad-phone.apk** — يُركّب على جوال ولي الأمر.
          files: dist/*.apk
          make_latest: true
